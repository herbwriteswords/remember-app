<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RemEmber">
<title>RemEmber</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <nav id="tabs" role="tablist">
    <button data-tab="today" class="tab"><svg viewBox="0 0 24 24"><path d="M12 3c1 3 4 4.5 4 8.5A4 4 0 0 1 8 11.5c0-1.6.7-2.7 1.6-3.6.2 1.4 1 2.3 1.9 2.6C11 8 11 5.5 12 3Z"/><path d="M5 20h14"/></svg><span>Today</span></button>
    <button data-tab="practice" class="tab"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg><span>Practice</span></button>
    <button data-tab="library" class="tab"><svg viewBox="0 0 24 24"><path d="M4 5h5v14H4zM10 5h5v14h-5zM16 6l3.5-1 2 13.5-3.5 1z"/></svg><span>Library</span></button>
    <button data-tab="settings" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></button>
  </nav>
  <div id="sheet-wrap" hidden><div id="sheet-backdrop"></div><section id="sheet" role="dialog" aria-modal="true"></section></div>
  <div id="toast" role="status"></div>
</div>
<script src="method.js"></script>
<script src="bible.js"></script>
<script src="themes.js"></script>
<script src="app.js"></script>
</body>
</html>
