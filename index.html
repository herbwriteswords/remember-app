<!doctype html>

<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="styles.css">
<script>
/* Measure the iOS standalone "chin" (layout viewport shorter than the screen) before first paint. */
(function(){function m(){var s=window.screen,portrait=innerHeight>=innerWidth,phys=portrait?Math.max(s.height,s.width):Math.min(s.height,s.width);
var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
var kbOpen=window.visualViewport&&(innerHeight-visualViewport.height)>120;
var gap=standalone&&!kbOpen?Math.round(phys-innerHeight):0;if(gap<0||gap>120)gap=0;
document.documentElement.style.setProperty('--chin',gap+'px');}
m();addEventListener('resize',m);addEventListener('orientationchange',function(){setTimeout(m,300)});addEventListener('pageshow',m);
window.__measureChin=m;})();
</script>

</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <nav id="tabs" role="tablist">
    <button data-tab="today" class="tab"><svg viewBox="0 0 24 24"><path d="M12 2.8c1 3 4.8 4.7 4.8 9.6a4.8 4.8 0 0 1-9.6 0c0-2.4 1.1-3.9 2.4-5 .2 1.3.8 2.2 1.6 2.6-.4-2.4-.1-4.8.8-7.2Z"/><rect class="eye" x="9.9" y="12" width="1.4" height="3.2" rx=".7" transform="rotate(-14 10.6 13.6)"/><rect class="eye" x="12.7" y="12" width="1.4" height="3.2" rx=".7" transform="rotate(-14 13.4 13.6)"/></svg><span>Today</span></button>
    <button data-tab="practice" class="tab"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg><span>Practice</span></button>
    <button data-tab="library" class="tab"><svg viewBox="0 0 24 24"><path d="M4 5h5v14H4zM10 5h5v14h-5zM16 6l3.5-1 2 13.5-3.5 1z"/></svg><span>Library</span></button>
    <button data-tab="settings" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></button>
  </nav>
  <div id="sheet-wrap" hidden><div id="sheet-backdrop"></div><section id="sheet" role="dialog" aria-modal="true"></section></div>
  <div id="toast" role="status"></div>
</div>
<script src="config.js"></script>
<script src="method.js"></script>
<script src="bible.js"></script>
<script src="app.js"></script>
</body>
</html>
